    import { getFirestore, collection, doc, getDoc, setDoc, addDoc, updateDoc, deleteDoc, onSnapshot, query, orderBy, limit, writeBatch, Timestamp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-analytics.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCMTp66QNMval2OtEVGp11d2VOYH5Xzmpc",
      authDomain: "lgoncalves-c1a3e.firebaseapp.com",
      projectId: "lgoncalves-c1a3e",
      storageBucket: "lgoncalves-c1a3e.firebasestorage.app",
      messagingSenderId: "838969509051",
      appId: "1:838969509051:web:9873206ab56e1cb520159e",
      measurementId: "G-VS3PLPCXWQ"
    };

    const firebaseApp = initializeApp(firebaseConfig);
    const auth = getAuth(firebaseApp);
    const db = getFirestore(firebaseApp);
    const analytics = getAnalytics(firebaseApp);

    const state = {
      employees: [],
      records: [],
      audit: [],
      settings: {
        companyName: "L Gonçalves Construtora & Obra",
        cnpj: "",
        timezone: "America/Sao_Paulo",
        tolerance: 10
      },
      admin: null,
      firebaseReady: true,
      syncStatus: "Conectando..."
    };

    let currentRoute = "terminal";
    let adminTab = "dashboard";
    let filterEmp = "all";
    let filterDate = "";
    let reportMonth = getLocalMonth();

    let unsubscribeEmployees = null;
    let unsubscribeRecords = null;
    let unsubscribeAudit = null;
    let unsubscribeSettings = null;

    function escapeHTML(value) {
      return String(value ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    function generateId() {
      return Math.random().toString(36).slice(2) + Date.now().toString(36);
    }

    function getLocalDateKey(date = new Date()) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, "0");
      const d = String(date.getDate()).padStart(2, "0");
      return `${y}-${m}-${d}`;
    }

    function getLocalMonth(date = new Date()) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, "0");
      return `${y}-${m}`;
    }

    function getLocalTime(date = new Date()) {
      return date.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
    }

    function formatDateTime(value) {
      if (!value) return "--";
      let date = value instanceof Timestamp || value?.toDate ? value.toDate() : new Date(value);
      if (isNaN(date.getTime())) return "--";
      return date.toLocaleString("pt-BR");
    }

    function toDate(value) {
      if (value instanceof Timestamp || value?.toDate) return value.toDate();
      return new Date(value);
    }

    function getRecordDate(value) {
      return getLocalDateKey(toDate(value));
    }

    function showToast(message, type = "success") {
      const old = document.getElementById("global-toast");
      if (old) old.remove();

      const toast = document.createElement("div");
      toast.id = "global-toast";
      const success = type === "success";
      toast.className = `fixed z-[9999] left-1/2 -translate-x-1/2 bottom-5 md:bottom-8 w-[calc(100%-32px)] max-w-md px-4 py-3 rounded-2xl border shadow-2xl glass text-sm font-medium fade-in ${success ? "border-emerald-500/30 text-emerald-300" : "border-red-500/30 text-red-300"}`;
      toast.innerHTML = `<div class="flex items-center gap-3"><span class="text-lg">${success ? "✓" : "!"}</span><span>${escapeHTML(message)}</span></div>`;
      document.body.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = "0";
        setTimeout(() => toast.remove(), 250);
      }, 3500);
    }

    function showTerminalFeedback(message, type) {
      const element = document.getElementById("terminal-feedback");
      if (!element) return;
      element.classList.remove("hidden");
      element.className = `p-4 rounded-2xl text-center text-sm font-medium fade-in ${type === "success" ? "bg-emerald-500/10 border border-emerald-500/20 text-emerald-400" : "bg-red-500/10 border border-red-500/20 text-red-400"}`;
      element.textContent = message;
      setTimeout(() => element.classList.add("hidden"), 4500);
    }

    function navigate(route) {
      currentRoute = route;
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function setAdminTab(tab) {
      adminTab = tab;
      render();
    }

    function getCurrentAdminName() {
      return state.admin?.name || state.admin?.email || auth.currentUser?.email || "Administrador";
    }

    function startSettingsListener() {
      if (unsubscribeSettings) unsubscribeSettings();
      unsubscribeSettings = onSnapshot(doc(db, "settings", "general"), snapshot => {
        if (snapshot.exists()) {
          state.settings = { ...state.settings, ...snapshot.data() };
        }
        state.syncStatus = "Sincronizado";
        if (currentRoute === "terminal" || currentRoute === "admin-dashboard") render();
      }, error => {
        console.error(error);
        state.syncStatus = "Erro de conexão";
        if (currentRoute === "terminal") render();
      });
    }

    function startEmployeesListener() {
      if (unsubscribeEmployees) unsubscribeEmployees();
      unsubscribeEmployees = onSnapshot(collection(db, "employees"), snapshot => {
        state.employees = snapshot.docs.map(item => ({ id: item.id, ...item.data() }));
        state.employees.sort((a, b) => String(a.name || "").localeCompare(String(b.name || ""), "pt-BR"));
        state.syncStatus = "Sincronizado";
        if (currentRoute === "admin-dashboard") render();
      }, error => {
        console.error(error);
        state.syncStatus = "Erro de conexão";
        if (currentRoute === "admin-dashboard") render();
      });
    }

    function startAdminListeners() {
      if (unsubscribeRecords) unsubscribeRecords();
      if (unsubscribeAudit) unsubscribeAudit();

      const recordsQuery = query(collection(db, "records"), orderBy("timestamp", "desc"), limit(1000));
      unsubscribeRecords = onSnapshot(recordsQuery, snapshot => {
        state.records = snapshot.docs.map(item => ({ id: item.id, ...item.data() }));
        if (currentRoute === "admin-dashboard") render();
      }, error => {
        console.error("Erro nos registros:", error);
      });

      const auditQuery = query(collection(db, "audit"), orderBy("timestamp", "desc"), limit(500));
      unsubscribeAudit = onSnapshot(auditQuery, snapshot => {
        state.audit = snapshot.docs.map(item => ({ id: item.id, ...item.data() }));
        if (currentRoute === "admin-dashboard") render();
      }, error => {
        console.error("Erro na auditoria:", error);
      });
    }

    function stopAdminListeners() {
      if (unsubscribeRecords) { unsubscribeRecords(); unsubscribeRecords = null; }
      if (unsubscribeAudit) { unsubscribeAudit(); unsubscribeAudit = null; }
    }

    onAuthStateChanged(auth, async user => {
      if (!user) {
        state.admin = null;
        stopAdminListeners();
        if (currentRoute === "admin-dashboard") navigate("admin-login");
        return;
      }
      try {
        const adminSnap = await getDoc(doc(db, "admins", user.uid));
        if (!adminSnap.exists()) {
          await signOut(auth);
          state.admin = null;
          showToast("Usuário autenticado, mas sem permissão de administrador.", "error");
          navigate("admin-login");
          return;
        }
        state.admin = { uid: user.uid, email: user.email, ...adminSnap.data() };
        startAdminListeners();
        if (currentRoute === "admin-login") navigate("admin-dashboard");
        else render();
      } catch (error) {
        console.error(error);
        await signOut(auth);
        showToast("Não foi possível validar o administrador.", "error");
        navigate("admin-login");
      }
    });

    async function handleAdminLogin(event) {
      event.preventDefault();
      const email = document.getElementById("admin-email")?.value.trim();
      const password = document.getElementById("admin-pass")?.value;
      const button = event.submitter;
      if (button) { button.disabled = true; button.textContent = "Entrando..."; }

      try {
        await signInWithEmailAndPassword(auth, email, password);
      } catch (error) {
        console.error(error);
        let message = "E-mail ou senha incorretos.";
        if (error.code === "auth/too-many-requests") message = "Muitas tentativas. Aguarde alguns minutos.";
        if (error.code === "auth/network-request-failed") message = "Sem conexão com a internet.";

        const element = document.getElementById("admin-login-error");
        if (element) {
          element.textContent = message;
          element.classList.remove("hidden");
        }
        if (button) { button.disabled = false; button.textContent = "Entrar no Painel"; }
      }
    }

    async function adminLogout() {
      try {
        await signOut(auth);
        state.admin = null;
        navigate("terminal");
      } catch (error) {
        console.error(error);
        showToast("Não foi possível sair.", "error");
      }
    }

    function renderTerminalPage() {
      const company = state.settings.companyName || "L GONÇALVES";
      return `

              <div class="min-w-0">

                ${escapeHTML(state.syncStatus)}

            </div>
          </header>

          <main class="w-full max-w-md mx-auto my-auto py-10">
            <div class="bg-cardBg border border-zinc-800/80 rounded-[28px] p-5 md:p-8 shadow-2xl shadow-black/30 slide-up">
              <div class="text-center mb-7">
                <div class="w-14 h-14 mx-auto rounded-2xl bg-blue-600/10 border border-blue-600/20 flex items-center justify-center mb-4">
                  <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" class="text-blue-400"><path d="M12 6v6l4 2"/><circle cx="12" cy="12" r="9"/></svg>
                </div>
                <h1 class="text-xl md:text-2xl font-bold text-white">Registro de Ponto</h1>
                <p class="text-xs md:text-sm text-zinc-500 mt-2">Digite seu código PIN de 4 dígitos</p>
              </div>

              <div id="terminal-feedback" class="hidden mb-5"></div>

              <form onsubmit="handlePunchSubmit(event)" class="space-y-4">
                <input id="punch-code-input" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" autofocus required class="terminal-input w-full bg-inputBg border border-zinc-800 rounded-2xl py-5 text-center text-3xl font-mono font-bold text-blue-400 placeholder:text-zinc-700 focus:outline-none focus:border-blue-600 focus:ring-4 focus:ring-blue-600/10 transition" placeholder="0000">
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 active:scale-[.99] py-4 rounded-2xl text-sm font-bold text-white transition shadow-lg shadow-blue-600/20">Registrar Ponto</button>
              </form>

              <div class="flex items-center gap-3 my-6"><div class="h-px bg-zinc-800 flex-1"></div><span class="text-[10px] uppercase tracking-widest text-zinc-600">Terminal Oficial</span><div class="h-px bg-zinc-800 flex-1"></div></div>
              <div class="text-center text-[11px] text-zinc-600">Dados sincronizados automaticamente com a nuvem.</div>
            </div>
          </main>

          <footer class="text-center">
            <button onclick="navigate('admin-login')" class="text-xs text-zinc-600 hover:text-zinc-300 transition underline underline-offset-4">Área do Administrador</button>
          </footer>
        </div>
      `;
    }

    async function handlePunchSubmit(event) {
      event.preventDefault();
      const input = document.getElementById("punch-code-input");
      if (!input) return;
      const code = input.value.trim();

      if (!/^\d{4}$/.test(code)) {
        showTerminalFeedback("Digite exatamente 4 números.", "error");
        input.value = "";
        input.focus();
        return;
      }

      input.disabled = true;

      try {
        const employeeRef = doc(db, "employees", code);
        const now = Timestamp.now();
        const today = getLocalDateKey(now.toDate());
        let result = null;

        await runTransaction(db, async transaction => {
          const employeeSnap = await transaction.get(employeeRef);
          if (!employeeSnap.exists()) throw new Error("EMPLOYEE_NOT_FOUND");

          const employee = employeeSnap.data();
          if (employee.active === false) throw new Error("EMPLOYEE_INACTIVE");

          let count = Number(employee.punchCount || 0);
          let punchDate = employee.punchDate || "";

          if (punchDate !== today) {
            count = 0;
            punchDate = today;
          }

          if (count >= 4) throw new Error("DAY_COMPLETED");

          const types = ["Entrada", "Intervalo", "Retorno", "Saída"];
          const type = types[count];
          const newCount = count + 1;

          transaction.update(employeeRef, {
            punchDate: today,
            punchCount: newCount,
            lastPunchType: type,
            lastPunchAt: now
          });

          const recordRef = doc(collection(db, "records"));
          transaction.set(recordRef, {
            employeeId: code,
            userId: code,
            userName: employee.name || "",
            cargo: employee.cargo || "",
            setor: employee.setor || "",
            code: code,
            type: type,
            timestamp: now,
            source: "terminal"
          });

          result = { name: employee.name, type };
        });

        showTerminalFeedback(`✓ ${result.name} — ${result.type} registrada com sucesso!`, "success");
        input.value = "";
        setTimeout(() => input.focus(), 100);
      } catch (error) {
        console.error(error);
        if (error.message === "EMPLOYEE_NOT_FOUND") showTerminalFeedback("Código PIN inválido ou funcionário não encontrado.", "error");
        else if (error.message === "EMPLOYEE_INACTIVE") showTerminalFeedback("Este funcionário está desativado.", "error");
        else if (error.message === "DAY_COMPLETED") showTerminalFeedback("A jornada de hoje já foi totalmente concluída.", "error");
        else showTerminalFeedback("Não foi possível registrar o ponto. Verifique a conexão.", "error");

        input.value = "";
        input.focus();
      } finally {
        input.disabled = false;
      }
    }

      return `

    function renderAdminDashboardView() {
      if (!state.admin) return renderAdminLoginPage();

      const employees = state.employees.filter(employee => employee.role !== "ADMIN");
      const records = state.records;
      const today = getLocalDateKey();
      const todayIds = [...new Set(records.filter(record => getRecordDate(record.timestamp) === today).map(record => record.userId))];
      const active = employees.filter(employee => employee.active !== false);
      const present = todayIds.length;
      const absent = Math.max(0, active.length - present);
      const withoutExit = active.filter(employee => {
        const recordsToday = records.filter(record => record.userId === employee.id && getRecordDate(record.timestamp) === today);
        return recordsToday.some(record => record.type === "Entrada") && !recordsToday.some(record => record.type === "Saída");
      });

      return `
        <div class="min-h-screen flex bg-darkBg">
          ${renderDesktopSidebar()}
          <main class="flex-1 min-w-0 p-4 md:p-8 pb-28 md:pb-8 overflow-x-hidden">

              </header>

              ${adminTab === "dashboard" ? renderDashboardTab(active.length, present, absent, withoutExit) : ""}
              ${adminTab === "employees" ? renderEmployeesTab(employees, records) : ""}
              ${adminTab === "records" ? renderRecordsTab(employees, records) : ""}
              ${adminTab === "audit" ? renderAuditTab(state.audit) : ""}
              ${adminTab === "settings" ? renderSettingsTab(state.settings) : ""}
              ${adminTab === "updates" ? renderUpdatesTab() : ""}

        </div>
      `;
    }

    function getFilteredRecords() {

      if (filterEmp !== "all") {

        filtered = filtered.filter(record => getRecordDate(record.timestamp) === filterDate);
      } else if (reportMonth) {
        filtered = filtered.filter(record => {
          const date = toDate(record.timestamp);
          return getLocalMonth(date) === reportMonth;
        });
      }
      return filtered;
    }

    function getRecordStatus(record) {
      const date = toDate(record.timestamp);
      if (record.type === "Entrada") {
        const tolerance = Number(state.settings.tolerance ?? 10);
        const limitMinutes = 8 * 60 + tolerance;
        const currentMinutes = date.getHours() * 60 + date.getMinutes();
        return currentMinutes > limitMinutes ? { text: "Atrasado", class: "bg-red-500/10 text-red-400" } : { text: "No horário", class: "bg-emerald-500/10 text-emerald-400" };
      }
      if (record.type === "Saída" && date.getHours() >= 18) {
        return { text: "Hora Extra", class: "bg-blue-500/10 text-blue-400" };
      }
      return { text: "Normal", class: "bg-zinc-500/10 text-zinc-400" };
    }

      const date = toDate(record.timestamp);

      `;
    }

            </div>

        </div>
      `;

          <div class="p-5 md:p-6 border-b border-zinc-800 flex items-center justify-between">
            <div>
              <h3 class="text-lg font-bold text-white">${employee ? "Editar Funcionário" : "Novo Funcionário"}</h3>
              <p class="text-xs text-zinc-500 mt-1">Cadastro do colaborador</p>
            </div>
            <button onclick="closeModal()" class="w-9 h-9 rounded-xl bg-zinc-800 text-zinc-400">×</button>
          </div>
          <form onsubmit="saveEmployee(event, '${employee?.id || ""}')" class="p-5 md:p-6 space-y-4">
            <div>
              <label class="block text-xs text-zinc-500 mb-2">Nome completo</label>
              <input id="employee-name" required value="${escapeHTML(employee?.name || "")}" class="w-full bg-inputBg border border-zinc-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-blue-600" placeholder="Nome do funcionário">
            </div>
            <div>
              <label class="block text-xs text-zinc-500 mb-2">PIN de 4 dígitos</label>
              <input id="employee-code" required maxlength="4" inputmode="numeric" pattern="[0-9]{4}" value="${escapeHTML(employee?.code || "")}" class="w-full bg-inputBg border border-zinc-800 rounded-xl px-4 py-3 text-sm font-mono text-blue-400 focus:outline-none focus:border-blue-600" placeholder="0000">
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
              <div>
                <label class="block text-xs text-zinc-500 mb-2">Cargo</label>
                <input id="employee-cargo" value="${escapeHTML(employee?.cargo || "")}" class="w-full bg-inputBg border border-zinc-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-blue-600" placeholder="Cargo">
              </div>
              <div>
                <label class="block text-xs text-zinc-500 mb-2">Setor</label>
                <input id="employee-setor" value="${escapeHTML(employee?.setor || "")}" class="w-full bg-inputBg border border-zinc-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-blue-600" placeholder="Setor">
              </div>
            </div>
            <label class="flex items-center justify-between bg-inputBg border border-zinc-800 rounded-xl p-4 cursor-pointer">
              <div>
                <div class="text-xs font-medium text-white">Funcionário ativo</div>
                <div class="text-[10px] text-zinc-600 mt-1">Permite registrar ponto pelo terminal.</div>
              </div>
              <input id="employee-active" type="checkbox" ${employee?.active !== false ? "checked" : ""} class="w-5 h-5 accent-blue-600">
            </label>
            <div class="flex gap-2 pt-2">
              <button type="button" onclick="closeModal()" class="flex-1 bg-zinc-800 text-zinc-300 py-3 rounded-xl text-sm">Cancelar</button>
              <button type="submit" class="flex-1 bg-blue-600 hover:bg-blue-500 text-white py-3 rounded-xl text-sm font-bold">Salvar</button>
            </div>
          </form>
        </div>
      `;
      document.body.appendChild(modal);
    }

    async function saveEmployee(event, oldId) {
      event.preventDefault();
      const name = document.getElementById("employee-name").value.trim();
      const code = document.getElementById("employee-code").value.trim();
      const cargo = document.getElementById("employee-cargo").value.trim();
      const setor = document.getElementById("employee-setor").value.trim();
      const active = document.getElementById("employee-active").checked;

      if (!/^\d{4}$/.test(code)) {
        showToast("O PIN precisa ter exatamente 4 números.", "error");
        return;
      }

      const duplicate = state.employees.find(employee => employee.code === code && employee.id !== oldId);
      if (duplicate) {
        showToast("Este PIN já está sendo utilizado.", "error");
        return;
      }

      try {
        const data = {
          id: code,
          code,
          name,
          cargo,
          setor,
          role: "EMPLOYEE",
          active,
          punchDate: "",
          punchCount: 0,
          lastPunchType: "",
          lastPunchAt: null
        };

        if (oldId) {
          const oldEmployee = state.employees.find(employee => employee.id === oldId);
          if (!oldEmployee) throw new Error("Funcionário não encontrado.");

          data.punchDate = oldEmployee.punchDate || "";
          data.punchCount = Number(oldEmployee.punchCount || 0);
          data.lastPunchType = oldEmployee.lastPunchType || "";
          data.lastPunchAt = oldEmployee.lastPunchAt || null;

          if (oldId !== code) {
            await setDoc(doc(db, "employees", code), data);
            await deleteDoc(doc(db, "employees", oldId));
          } else {
            await setDoc(doc(db, "employees", code), data);
          }

          await addAudit(`Editou os dados do funcionário ${name}.`);
          showToast("Funcionário atualizado com sucesso.");
        } else {
          await setDoc(doc(db, "employees", code), data);
          await addAudit(`Cadastrou o funcionário ${name} (PIN: ${code}).`);
          showToast("Funcionário cadastrado com sucesso.");
        }
        closeModal();
      } catch (error) {
        console.error(error);
        showToast("Não foi possível salvar o funcionário.", "error");
      }
    }

    async function toggleEmployeeStatus(employeeId) {
      const employee = state.employees.find(item => item.id === employeeId);
      if (!employee) return;
      const newStatus = employee.active === false;

      try {
        await updateDoc(doc(db, "employees", employeeId), { active: newStatus });
        await addAudit(`${newStatus ? "Ativou" : "Desativou"} o funcionário ${employee.name}.`);
        showToast(newStatus ? "Funcionário ativado." : "Funcionário desativado.");
      } catch (error) {
        console.error(error);
        showToast("Não foi possível alterar o status.", "error");
      }
    }

    function openRecordEditor(recordId = null, defaults = {}) {
      const record = recordId ? state.records.find(item => item.id === recordId) : null;
      const employees = [...state.employees];
      if (!employees.length) {
        showToast("Cadastre um funcionário primeiro.", "error");
        return;
      }

      let selectedEmployee = record?.userId || defaults.userId || employees[0].id;
      let date = record ? getLocalDateKey(toDate(record.timestamp)) : defaults.date || getLocalDateKey();
      let time = record ? getLocalTime(toDate(record.timestamp)) : defaults.time || getLocalTime();

      const modal = document.createElement("div");
      modal.id = "modal-container";
      modal.className = `fixed inset-0 z-[500] bg-black/70 backdrop-blur-sm flex items-end md:items-center justify-center p-0 md:p-4 fade-in`;
      modal.innerHTML = `
        <div class="w-full max-w-lg bg-cardBg border border-zinc-800 rounded-t-[28px] md:rounded-[28px] shadow-2xl slide-up max-h-[92vh] overflow-y-auto">
          <div class="p-5 md:p-6 border-b border-zinc-800 flex items-center justify-between">
            <div>
              <h3 class="text-lg font-bold text-white">${record ? "Editar Registro" : "Adicionar Ponto"}</h3>
              <p class="text-xs text-zinc-500 mt-1">Data, horário e tipo da batida</p>
            </div>
            <button onclick="closeModal()" class="w-9 h-9 rounded-xl bg-zinc-800 text-zinc-400">×</button>
          </div>
          <form onsubmit="saveRecordFromModal(event, '${record?.id || ""}')" class="p-5 md:p-6 space-y-4">
            <div>
              <label class="block text-xs text-zinc-500 mb-2">Funcionário</label>
              <select id="record-employee" class="w-full bg-inputBg border border-zinc-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-blue-600">
                ${employees.map(employee => `<option value="${escapeHTML(employee.id)}" ${employee.id === selectedEmployee ? "selected" : ""}>${escapeHTML(employee.name)} — PIN${escapeHTML(employee.code)}</option>`).join("")}
              </select>
            </div>
            <div>
              <label class="block text-xs text-zinc-500 mb-2">Tipo de ponto</label>
              <select id="record-type" class="w-full bg-inputBg border border-zinc-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-blue-600">
                ${["Entrada", "Intervalo", "Retorno", "Saída"].map(type => `<option value="${type}" ${(record?.type \vert{}\vert{} defaults.type \vert{}\vert{} "Entrada") === type ? "selected" : ""}>${type}</option>`).join("")}
              </select>
            </div>
            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="block text-xs text-zinc-500 mb-2">Data</label>
                <input id="record-date" type="date" value="${date}" required class="w-full bg-inputBg border border-zinc-800 rounded-xl px-3 py-3 text-xs text-white focus:outline-none focus:border-blue-600">
              </div>
              <div>
                <label class="block text-xs text-zinc-500 mb-2">Horário</label>
                <input id="record-time" type="time" value="${time}" required class="w-full bg-inputBg border border-zinc-800 rounded-xl px-3 py-3 text-xs text-white focus:outline-none focus:border-blue-600">
              </div>
            </div>
            <div class="flex gap-2 pt-2">
              <button type="button" onclick="closeModal()" class="flex-1 bg-zinc-800 text-zinc-300 py-3 rounded-xl text-sm">Cancelar</button>
              <button type="submit" class="flex-1 bg-blue-600 hover:bg-blue-500 text-white py-3 rounded-xl text-sm font-bold">Salvar Registro</button>
            </div>
          </form>
        </div>
      `;
      document.body.appendChild(modal);
    }

    async function saveRecordFromModal(event, recordId) {
      event.preventDefault();
      const employeeId = document.getElementById("record-employee").value;
      const type = document.getElementById("record-type").value;
      const date = document.getElementById("record-date").value;
      const time = document.getElementById("record-time").value;

      const employee = state.employees.find(item => item.id === employeeId);
      if (!employee) {
        showToast("Funcionário não encontrado.", "error");
        return;
      }

      const dateObject = new Date(`${date}T${time}:00`);
      if (isNaN(dateObject.getTime())) {
        showToast("Data ou horário inválido.", "error");
        return;
      }

      try {
        const timestamp = Timestamp.fromDate(dateObject);
        if (recordId) {
          const oldRecord = state.records.find(record => record.id === recordId);
          await updateDoc(doc(db, "records", recordId), {
            employeeId: employee.id,
            userId: employee.id,
            userName: employee.name,
            cargo: employee.cargo || "",
            setor: employee.setor || "",
            code: employee.code,
            type,
            timestamp
          });
          await addAudit(`Editou registro de ${employee.name}.`);
          showToast("Registro atualizado com sucesso.");
        } else {
          await addDoc(collection(db, "records"), {
            employeeId: employee.id,
            userId: employee.id,
            userName: employee.name,
            cargo: employee.cargo || "",
            setor: employee.setor || "",
            code: employee.code,
            type,
            timestamp,
            source: "admin"
          });
          await addAudit(`Adicionou manualmente ${type} para ${employee.name}.`);
          showToast("Ponto adicionado com sucesso.");
        }
        closeModal();
      } catch (error) {
        console.error(error);
        showToast("Não foi possível salvar o registro.", "error");
      }
    }

    async function quickEditDayTime(employeeId, type) {
      const record = state.records.find(item => item.userId === employeeId && item.type === type && getRecordDate(item.timestamp) === getLocalDateKey());
      if (record) openRecordEditor(record.id);
      else openRecordEditor(null, { userId: employeeId, type, date: getLocalDateKey(), time: getLocalTime() });
    }

    async function deleteRecord(id) {
      const record = state.records.find(item => item.id === id);
      if (!record) return;
      if (!confirm(`Excluir o registro de ${record.userName} (${record.type})?`)) return;

      try {
        await deleteDoc(doc(db, "records", id));
        await addAudit(`Excluiu registro de ${record.userName} (${record.type}).`);
        showToast("Registro excluído.");
      } catch (error) {
        console.error(error);
        showToast("Não foi possível excluir o registro.", "error");
      }
    }

    async function addAudit(description) {
      if (!auth.currentUser) return;
      await addDoc(collection(db, "audit"), {
        adminUid: auth.currentUser.uid,
        adminName: getCurrentAdminName(),
        description,
        timestamp: Timestamp.now()
      });
    }

    async function saveCompanySettings(event) {
      event.preventDefault();
      const companyName = document.getElementById("set-company-name").value.trim();
      const cnpj = document.getElementById("set-cnpj").value.trim();
      const timezone = document.getElementById("set-timezone").value.trim();
      const tolerance = Number(document.getElementById("set-tolerance").value) || 0;

      try {
        await setDoc(doc(db, "settings", "general"), { companyName, cnpj, timezone, tolerance, updatedAt: Timestamp.now() }, { merge: true });
        await addAudit(`Atualizou as configurações da empresa.`);
        showToast("Configurações salvas.");
      } catch (error) {
        console.error(error);
        showToast("Não foi possível salvar as configurações.", "error");
      }
    }

    function exportBackup() {
      const backup = {
        version: "3.0.0",
        exportedAt: new Date().toISOString(),
        employees: state.employees,
        records: state.records,
        audit: state.audit,
        settings: state.settings
      };
      const blob = new Blob([JSON.stringify(backup, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = `backup-lgoncalves-${getLocalDateKey()}.json`;
      link.click();
      URL.revokeObjectURL(url);
      showToast("Backup baixado com sucesso.");
    }

    async function importBackup(event) {
      const file = event.target.files?.[0];
      if (!file) return;

      try {
        const text = await file.text();
        const data = JSON.parse(text);
        if (!data.employees || !data.records) throw new Error("BACKUP_INVALID");

        if (!confirm("Restaurar este backup?\n\nOs dados existentes serão atualizados com os dados do arquivo.")) return;

        const batch = writeBatch(db);
        for (const emp of data.employees) {
          batch.set(doc(db, "employees", emp.code || emp.id), emp, { merge: true });
        }
        for (const rec of data.records) {
          const recData = { ...rec, timestamp: rec.timestamp ? Timestamp.fromDate(new Date(rec.timestamp)) : Timestamp.now() };
          batch.set(doc(db, "records", rec.id || generateId()), recData, { merge: true });
        }
        await batch.commit();
        showToast("Backup restaurado com sucesso.");
      } catch (error) {
        console.error(error);
        showToast("Arquivo de backup inválido.", "error");
      } finally {
        event.target.value = "";
      }
    }

    function generatePDF(type) {
      const oldDate = filterDate;
      const oldMonth = reportMonth;
      if (type === "day") filterDate = filterDate || getLocalDateKey();
      if (type === "month") { filterDate = ""; reportMonth = reportMonth || getLocalMonth(); }
      render();
      setTimeout(() => {
        window.print();
        setTimeout(() => { filterDate = oldDate; reportMonth = oldMonth; render(); }, 500);
      }, 250);
    }

    function closeModal() {
      const modal = document.getElementById("modal-container");
      if (modal) modal.remove();
    }

    document.addEventListener("keydown", event => {
      if (event.key === "Escape") closeModal();
    });

    function updateClock() {
      const text = new Date().toLocaleString("pt-BR");
      const terminalClock = document.getElementById("terminal-clock");
      const adminClock = document.getElementById("admin-clock");
      if (terminalClock) terminalClock.textContent = text;
      if (adminClock) adminClock.textContent = text;
    }

    setInterval(updateClock, 1000);

    function render() {
      const app = document.getElementById("app");
      if (!app) return;

      if (currentRoute === "terminal") {
        app.innerHTML = renderTerminalPage();
        updateClock();
        setTimeout(() => {
          const input = document.getElementById("punch-code-input");
          if (input) input.focus();
        }, 100);
        return;
      }

      if (currentRoute === "admin-login") {
        app.innerHTML = renderAdminLoginPage();
        return;
      }

      if (currentRoute === "admin-dashboard") {
        if (!state.admin) {
          currentRoute = "admin-login";
          app.innerHTML = renderAdminLoginPage();
          return;
        }
        app.innerHTML = renderAdminDashboardView();
        updateClock();
        return;
      }

      app.innerHTML = renderTerminalPage();
    }

    startSettingsListener();
    startEmployeesListener();
    render();
  </script>

</body>
</html>
